<body>
<div id="app"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
<script type="text/babel" data-type="module">
const { useState, useEffect, useCallback } = React;

const DOT_VALUE = 0.50;
const STORAGE_KEY = "bowling_dot_v10";
const MAIN_KEY = "main";

const COLORS = [
  {bg:"#FF6B35",text:"#fff"},
  {bg:"#4ECDC4",text:"#111"},
  {bg:"#FFE66D",text:"#111"},
  {bg:"#C77DFF",text:"#fff"},
  {bg:"#F72585",text:"#fff"},
  {bg:"#06D6A0",text:"#111"},
];

const REGULARS = ["Rich Pennal","John Crowder","Robert McQuoid","Adam Perski","Trey Simpson"];

// ─── Frame outcome types ──────────────────────────────────────────────────────
// Frames 1-9: one outcome + optional flags
// Frame 10: up to 3 throws — stored as throws[0..2], each a single outcome
//   For frame 10: throws[0] is always first ball outcome
//   If throws[0]=strike, throws[1] is second ball, throws[2] is third ball
//   If throws[0]=spare/open/etc, only 2 balls (no bonus)

// Single-throw outcomes (what happened on this "turn")
const THROW_OUTCOMES = [
  { id:"strike",     sym:"X",  color:"#FFE66D", desc:"Strike" },
  { id:"spare",      sym:"/",  color:"#4ECDC4", desc:"Spare (no split)" },
  { id:"open",       sym:"—",  color:"#FF6B35", desc:"Open (missed spare)" },
  { id:"split-open", sym:"S",  color:"#F72585", desc:"Split — missed" },
  { id:"split-spare",sym:"S/", color:"#06D6A0", desc:"Split — converted" },
  { id:"miss5",      sym:"5",  color:"#C77DFF", desc:"Missed 5-pin" },
];

const SPLIT_SUBTYPES = [
  { id:"small", label:"Small Split", icon:"👏", desc:"3-10, 2-7, etc." },
  { id:"large", label:"Large Split",  icon:"🎉", desc:"Big gap splits" },
  { id:"710",   label:"7-10 Split!", icon:"👑", desc:"The big one" },
];

const frameStyleMap = {
  null:         { sym:"·",  cls:"empty",      symColor:"#2a2a4a" },
  strike:       { sym:"X",  cls:"strike",     symColor:"#FFE66D" },
  spare:        { sym:"/",  cls:"spare",      symColor:"#4ECDC4" },
  open:         { sym:"—",  cls:"open",       symColor:"#FF6B35" },
  "split-open": { sym:"S",  cls:"split-open", symColor:"#F72585" },
  "split-spare":{ sym:"S/", cls:"split-spare",symColor:"#06D6A0" },
  miss5:        { sym:"5",  cls:"miss5",      symColor:"#C77DFF" },
};

// Frame 1-9: { outcome, splitType }
// Frame 10: { throws: [{outcome, splitType}, {outcome, splitType}, {outcome, splitType}] }
const emptyFrame = () => ({outcome:null, splitType:null});
const emptyFrame10 = () => ({throws:[{outcome:null,splitType:null},{outcome:null,splitType:null},{outcome:null,splitType:null}]});
const emptyGame = () => [...Array(9)].map(emptyFrame).concat([emptyFrame10()]);

const isOpen = o => o==="open"||o==="split-open"||o==="miss5";
const isStrike = o => o==="strike";
const isSpare = o => o==="spare"||o==="split-spare";

// ─── State ────────────────────────────────────────────────────────────────────
const initState = () => ({
  players: REGULARS.map((n,i) => ({
    id:i+1, name:n, average:null, colorIdx:i%COLORS.length,
    isRegular:true, stats:{}, balance:{}, paid:{},
  })),
  weekHistory: [],
  session: null,
});

const load = () => { try { const r=localStorage.getItem(STORAGE_KEY); return r?JSON.parse(r):null; } catch { return null; } };
const save = s => { try { localStorage.setItem(STORAGE_KEY,JSON.stringify(s)); } catch {} };

const owedFor = (dots,discount) => Math.max(0, Math.max(0,dots)*DOT_VALUE - (discount||0));
const allPotKeys = wh => { const k=new Set(); wh.forEach(w=>w.groups.forEach(g=>k.add(g.potKey))); return [...k]; };
const potTotal = (wh,key) => wh.reduce((s,w)=>{ const g=w.groups.find(g=>g.potKey===key); return s+(g?g.totalPaid||0:0); },0);
// Historical only: old seasons had a separate weekly "side pot" for whoever was
// absent that night, keyed "side-wk<N>". New weeks are one pot only (present
// players); this labeling still applies to any pre-existing side-wk history.
const potLabel = (wh,key) => {
  if (key===MAIN_KEY) return "Main Pot";
  const w = wh.find(w=>w.groups.some(g=>g.potKey===key));
  return w ? "Side Pot · Wk "+w.weekNum : "Side Pot";
};

const todayISO = () => { const d=new Date(); const p=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); };
const fmtDate = iso => { try { return new Date(iso+"T00:00:00").toLocaleDateString(); } catch { return iso; } };

// Fair payout split: each week's COLLECTED pot money (totalPaid) is split
// equally among exactly the players who were members of that pot that week --
// so someone who only played some weeks only gets a share of those weeks.
// "side" only ever accumulates from historical side-pot weeks (pre-refactor);
// new weeks are one pot only and always land in "main".
const fairPayoutSplit = wh => {
  const byPlayer = {};
  wh.forEach(wk => {
    wk.groups.forEach(g => {
      if (g.playerIds.length === 0) return;
      const share = (g.totalPaid||0) / g.playerIds.length;
      g.playerIds.forEach(pid => {
        if (!byPlayer[pid]) byPlayer[pid] = {main:0, side:0, total:0};
        if (g.potKey === MAIN_KEY) byPlayer[pid].main += share; else byPlayer[pid].side += share;
        byPlayer[pid].total += share;
      });
    });
  });
  return byPlayer;
};

// A player's running balance for a pot is always computed FRESH from the
// season ledger (weekHistory) -- sum of every week's dot-charge (dotsOwed,
// which is immutable once a week closes) minus every payment ever logged
// against that pot (amountPaid, whether logged live before close or
// retroactively via Week History afterward). This is deliberately NOT a
// cached/carried-forward snapshot: a snapshot taken at one week's close can
// go stale the moment a later payment is logged against an OLDER week (e.g.
// paying off the rest of Week 1 after Week 2 is already closed) -- the
// snapshot has no way to hear about that. Recomputing from the ledger every
// time means it's always correct regardless of payment order or timing.
const totalOwedByPot = (wh, pid, potKey) => wh.reduce((t,wk)=>{
  const g = wk.groups.find(g=>g.potKey===potKey);
  const c = g && g.contributions.find(c=>c.playerId===pid);
  return t + (c ? c.dotsOwed : 0);
}, 0);
const totalPaidByPot = (wh, pid, potKey) => wh.reduce((t,wk)=>{
  const g = wk.groups.find(g=>g.potKey===potKey);
  const c = g && g.contributions.find(c=>c.playerId===pid);
  return t + (c ? (c.amountPaid||0) : 0);
}, 0);
const currentBalance = (wh, pid, potKey) => totalOwedByPot(wh,pid,potKey) - totalPaidByPot(wh,pid,potKey);
const allPotKeysForPlayer = (wh, pid) => { const s=new Set(); wh.forEach(wk=>wk.groups.forEach(g=>{ if(g.contributions.some(c=>c.playerId===pid)) s.add(g.potKey); })); return [...s]; };
// A group's contributions with carryIn/amountOwed recomputed live (as of
// right now) instead of trusting the frozen values stored at that week's
// close -- so a retroactive payment on an earlier week immediately corrects
// every later week's display too, not just going-forward balances.
const liveGroup = (wh, wk, g) => {
  const priorWh = wh.filter(w=>w.weekNum < wk.weekNum);
  const contributions = g.contributions.map(c=>{
    const carryIn = currentBalance(priorWh, c.playerId, g.potKey);
    const amountOwed = Math.max(0, c.dotsOwed + carryIn);
    return {...c, carryIn, amountOwed};
  });
  return {...g, contributions, totalOwed: contributions.reduce((t,c)=>t+c.amountOwed,0)};
};

// ─── Dot Analysis ─────────────────────────────────────────────────────────────
function analyzeDots(players, session) {
  const absentSet = new Set(session.absentIds||[]);
  const res = {};
  // byGame: per-game dot subtotal (index = game number - 1). manualDots: dots not tied to any game.
  players.forEach(p => { res[p.id]={dots:0,dollarDiscount:0,events:[],byGame:[],manualDots:0}; });

  const dot = (pid,n,label,icon,gi) => {
    res[pid].dots+=n;
    res[pid].events.push({label,icon,dots:n,game:gi!=null?gi+1:null});
    if (gi!=null) res[pid].byGame[gi]=(res[pid].byGame[gi]||0)+n; else res[pid].manualDots+=n;
  };
  const disc = (pid,n,label,icon) => { res[pid].dollarDiscount+=n; res[pid].events.push({label,icon,dollars:n}); };
  const dotOthers = (pid,gids,n,label,icon,gi) => {
    gids.filter(id=>id!==pid).forEach(id=>{ if(res[id]){
      res[id].dots+=n;
      res[id].events.push({label:label+" (from teammate)",icon,dots:n,game:gi!=null?gi+1:null});
      if (gi!=null) res[id].byGame[gi]=(res[id].byGame[gi]||0)+n; else res[id].manualDots+=n;
    }});
  };

  // One pot only: absent players sit this week out entirely -- no dots,
  // no hung/streak/open analysis, no contribution, no payout share.
  const presentIds = players.filter(p=>!absentSet.has(p.id)).map(p=>p.id);

  // Manual dots (absent players can't be awarded manual dots for a week they didn't bowl)
  (session.manualDots||[]).forEach(md=>{ if(res[md.pid] && !absentSet.has(md.pid)) dot(md.pid,md.dots,md.label,md.icon); });

  // Build per-game, per-frame strike matrix for hung & team-streak logic
  // playerGames: { [pid]: [ game0frames, game1frames, ... ] }
  const pg = session.playerGames||{};
  const gameCount = Math.max(...players.map(p=>(pg[p.id]||[]).length), 1);
  for (let gi=0; gi<gameCount; gi++) {
    // ── Per-game analysis ──────────────────────────────────────────────────
    // Build a flat sequence of (playerIdx, frameIdx, outcome) for team-streak tracking
    // Team streak = consecutive strikes across all bowlers in order of bowling
    // Order: bowler 1 frame 1, bowler 2 frame 1, ... bowler N frame 1, bowler 1 frame 2, ...

    const gameFrames = {}; // pid -> frames array (10)
    players.forEach(p => {
      const games = pg[p.id]||[];
      gameFrames[p.id] = games[gi]||emptyGame();
    });

    // For frame fi, get outcome of player p (handle 10th frame specially)
    const frameOutcome = (pid, fi) => {
      const frames = gameFrames[pid];
      if (!frames) return null;
      if (fi < 9) return frames[fi] ? frames[fi].outcome : null;
      // 10th frame: use first throw for hung/team-streak logic
      const f10 = frames[9];
      if (!f10 || !f10.throws) return null;
      return f10.throws[0] ? f10.throws[0].outcome : null;
    };

    // ── First team open tracking (per game) ─────────────────────────────────
    // Find the first frame index where any present player opened, then award
    // the dot to every present player who also opened that frame.
    const findFirstOpenFrame = (groupIds) => {
      for (let fi = 0; fi < 10; fi++) {
        const anyOpen = groupIds.some(pid => {
          const o = frameOutcome(pid, fi);
          return o !== null && isOpen(o);
        });
        if (anyOpen) return fi;
      }
      return -1;
    };
    const firstOpenFrame = findFirstOpenFrame(presentIds);
    // Award first-team-open dots to all openers in that frame
    if (firstOpenFrame >= 0) {
      presentIds.forEach(pid => {
        const o = frameOutcome(pid, firstOpenFrame);
        if (o !== null && isOpen(o)) {
          dot(pid, 1, "First team open (frame "+(firstOpenFrame+1)+")", "🚩", gi);
        }
      });
    }

    // ── Hung logic ─────────────────────────────────────────────────────────
    // A player is "hung" in frame fi if:
    //   - They did NOT strike in frame fi
    //   - Every other present bowler in their group DID strike in frame fi
    // Consecutive hung frames get escalating dots

    // ── Team streak tracking (sequential, across frames) ───────────────────
    // Bowling order: frame 1 bowler 1, frame 1 bowler 2, ...frame 1 bowler N,
    //                frame 2 bowler 1, ...
    // We track a running streak count and who last struck
    // When someone doesn't strike, if streak >= 5, they get the dot

    // Build ordered sequence (present players only)
    [presentIds].forEach(groupIds => {
      if (groupIds.length === 0) return;
      let teamStreakCount = 0;
      let inStreak = false;

      // Walk frame by frame, bowler by bowler (in group order)
      for (let fi = 0; fi < 10; fi++) {
        for (let bi = 0; bi < groupIds.length; bi++) {
          const pid = groupIds[bi];
          const o = frameOutcome(pid, fi);
          if (o === null) continue; // not entered yet

          if (isStrike(o)) {
            teamStreakCount++;
            if (teamStreakCount >= 5) inStreak = true;
          } else {
            // Non-strike: if we were in a streak of 5+, this person broke it
            if (inStreak) {
              dot(pid, 1, "Broke team strike streak ("+teamStreakCount+")", "💥", gi);
            }
            teamStreakCount = 0;
            inStreak = false;
          }
        }
      }
    });

    // ── Per-player per-frame analysis ──────────────────────────────────────
    players.forEach(p => {
      if (absentSet.has(p.id)) return; // sat this week out -- no dot analysis
      const grp = presentIds;
      const frames = gameFrames[p.id];
      if (!frames) return;

      let hangStreak = 0;
      let strikeStreak = 0; // for turkey/4+ personal streak

      for (let fi = 0; fi < 10; fi++) {
        const is10 = fi===9;
        let o, splitType, throwsList;

        if (is10) {
          const f10 = frames[9];
          if (!f10 || !f10.throws) continue;
          throwsList = f10.throws;
          o = throwsList[0] ? throwsList[0].outcome : null;
          splitType = throwsList[0] ? throwsList[0].splitType : null;
        } else {
          const f = frames[fi];
          if (!f) continue;
          o = f.outcome;
          splitType = f.splitType;
        }

        if (o === null) { hangStreak=0; strikeStreak=0; continue; }

        // ── Personal strike streak (turkey / 4+) ──────────────────────────
        // Shared by the frame's required throw and, in the 10th, each fill
        // ball -- a strike on a fill ball still extends the streak (e.g.
        // strikes in frames 7-9 plus both 10th-frame balls is 5 in a row).
        const trackStrikeStreak = (struck) => {
          if (struck) {
            strikeStreak++;
            if (strikeStreak===3) {
              dotOthers(p.id,grp,1,"Turkey by "+p.name,"🦃",gi);
              res[p.id].events.push({label:"Turkey! (others +1)",icon:"🦃",dots:0,game:gi+1});
            } else if (strikeStreak>=4) {
              dotOthers(p.id,grp,2,strikeStreak+"-strike streak by "+p.name,"🔥",gi);
              res[p.id].events.push({label:strikeStreak+"-strike streak (others +2)",icon:"🔥",dots:0,game:gi+1});
            }
          } else {
            strikeStreak=0;
          }
        };
        trackStrikeStreak(isStrike(o));

        // ── Hung logic ────────────────────────────────────────────────────
        // Hung = only this player didn't strike, everyone else in group did.
        // Anything other than a strike counts -- spare, open, split, doesn't
        // matter what it was, only that everyone else struck and this player didn't.
        if (!isStrike(o)) {
          const groupStruck = grp.filter(id=>id!==p.id).every(id=>isStrike(frameOutcome(id, fi)));
          if (groupStruck && grp.length > 1) {
            // This player is hung this frame
            hangStreak++;
            if (hangStreak===1)      dot(p.id,2,"Hung (1 frame)","🪝",gi);
            else if (hangStreak===2) dot(p.id,3,"Hung 2 in a row","🪝🪝",gi);
            else                     dot(p.id,4,"Hung "+hangStreak+" in a row","🪝🪝🪝",gi);
          } else {
            hangStreak=0;
          }
        } else {
          hangStreak=0;
        }

        // ── Open frame dots ───────────────────────────────────────────────
        if (isOpen(o)) {
          dot(p.id,2,"Open frame","😬",gi);

          // Open 10th
          if (is10) dot(p.id,2,"Opened 10th frame","💀",gi);

          // Miss 5-pin
          if (o==="miss5") dot(p.id,2,"Missed 5-pin","🎯",gi);
        }

        // ── Split logic ───────────────────────────────────────────────────
        if (o==="split-open") dot(p.id,1,"Left a split","🎳",gi);

        const processSplitSpare = (st) => {
          if (st==="710") {
            res[p.id].dots=0; res[p.id].dollarDiscount=0; res[p.id].manualDots=0;
            res[p.id].byGame=res[p.id].byGame.map(()=>0);
            res[p.id].events.push({label:"7-10 CONVERSION! All dots WIPED!",icon:"👑",dots:0,wipe:true,game:gi+1});
          } else if (st==="large") {
            dotOthers(p.id,grp,2,p.name+" converted large split","🎉",gi);
            res[p.id].events.push({label:"Large split made! (others +2)",icon:"🎉",dots:0,game:gi+1});
          } else {
            dotOthers(p.id,grp,1,p.name+" converted small split","👏",gi);
            res[p.id].events.push({label:"Small split made! (others +1)",icon:"👏",dots:0,game:gi+1});
          }
        };
        if (o==="split-spare") processSplitSpare(splitType);

        // ── 10th frame bonus throws (fill balls) ────────────────────────────
        // Fill balls are the bonus throw(s) earned by a strike or spare on
        // the 10th's required attempt. Opening or leaving a split on a fill
        // ball doesn't count against you — only a converted split still
        // rewards the rest of the group.
        if (is10 && throwsList) {
          for (let t=1; t<3; t++) {
            const th = throwsList[t];
            if (!th || !th.outcome) continue;
            trackStrikeStreak(isStrike(th.outcome));
            if (th.outcome==="split-spare") processSplitSpare(th.splitType);
          }
        }
      }

      // ── Score-based checks (end of game) ─────────────────────────────────
      const scoreInput = ((session.gameScores||{})[p.id]||{})[gi];
      if (scoreInput && p.average) {
        const score = parseInt(scoreInput);
        if (!isNaN(score)) {
          if (score < p.average) dot(p.id,1,"Missed average ("+score+" vs avg "+p.average+")","📉",gi);
        }
      }
    });
  }

  // ── Series-based checks: 100+ under/over average across the whole series ──
  // (Sum of every game bowled this session vs. average × games bowled --
  // a bad/great night overall, not a single game.)
  players.forEach(p => {
    if (absentSet.has(p.id)) return;
    if (!p.average) return;
    const gs = (session.gameScores||{})[p.id]||{};
    const entries = Object.entries(gs).map(([gi,v])=>[parseInt(gi),parseInt(v)]).filter(([,v])=>!isNaN(v));
    if (entries.length === 0) return;
    const seriesTotal = entries.reduce((t,[,v])=>t+v,0);
    const expected = p.average * entries.length;
    const lastGi = Math.max(...entries.map(([g])=>g));
    if (expected - seriesTotal >= 100) {
      dot(p.id,20,"100+ under average for the series ("+seriesTotal+" vs "+expected+")","🤦",lastGi);
    }
    if (seriesTotal - expected >= 100) {
      disc(p.id,10,"100+ over average for the series ("+seriesTotal+" vs "+expected+") — $10 off!","🌟");
    }
  });

  return res;
}

// ─── Frame Picker ─────────────────────────────────────────────────────────────
function FramePicker({frameIdx, throwNum, color, existingOutcome, onPick, onClose}) {
  const [step, setStep] = useState("outcome");
  const is10 = frameIdx===9;

  const pick = (oid) => {
    if (oid==="split-spare") { setStep("splitType_"+oid); }
    else { onPick({outcome:oid, splitType:null}); }
  };
  const pickSplit = (oid, st) => { onPick({outcome:oid, splitType:st}); };

  const outcomes = THROW_OUTCOMES;

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" onClick={e=>e.stopPropagation()} style={{boxShadow:`0 -4px 40px ${color.bg}30`}}>
        {step==="outcome" && <>
          <div className="bhs mb-14" style={{fontSize:13,color:color.bg}}>
            {is10 ? "10TH FRAME — THROW "+(throwNum+1) : "FRAME "+(frameIdx+1)}
          </div>
          <div className="outcome-grid">
            {outcomes.map(o=>(
              <button key={o.id} className="outcome-pick" onClick={()=>pick(o.id)}
                style={{borderColor:o.color+"60",background:o.color+"0d"}}>
                <span style={{fontSize:26,fontWeight:900,color:o.color,lineHeight:1}}>{o.sym}</span>
                <span style={{fontSize:12,fontWeight:700,color:o.color}}>{o.desc}</span>
              </button>
            ))}
          </div>
          {existingOutcome && (
            <button onClick={()=>onPick({outcome:null,splitType:null})} style={{width:"100%",padding:"10px",borderRadius:10,background:"transparent",border:"1px solid #2a2a4e",color:"#555",fontWeight:700,fontSize:12,letterSpacing:1,textTransform:"uppercase"}}>
              Clear
            </button>
          )}
        </>}

        {step.startsWith("splitType_") && <>
          <div className="bhs mb-14" style={{fontSize:13,color:color.bg}}>WHAT KIND OF SPLIT?</div>
          <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:16}}>
            {SPLIT_SUBTYPES.map(st=>(
              <button key={st.id} className="outcome-pick" onClick={()=>pickSplit("split-spare",st.id)}
                style={{flexDirection:"row",gap:12,justifyContent:"flex-start",borderColor:color.bg+"50",background:color.bg+"0d"}}>
                <span style={{fontSize:26}}>{st.icon}</span>
                <div style={{textAlign:"left"}}>
                  <div style={{fontWeight:700,color:color.bg,fontSize:13}}>{st.label}</div>
                  <div style={{fontSize:10,color:"#666"}}>{st.desc}</div>
                </div>
              </button>
            ))}
          </div>
          <button onClick={()=>setStep("outcome")} style={{width:"100%",padding:"10px",borderRadius:10,background:"transparent",border:"1px solid #2a2a4e",color:"#555",fontWeight:700,fontSize:12,letterSpacing:1,textTransform:"uppercase"}}>
            ← Back
          </button>
        </>}
      </div>
    </div>
  );
}

// ─── Score Sheet ──────────────────────────────────────────────────────────────
function ScoreSheet({player, frames, gameScore, onUpdate, onScoreChange, readOnly}) {
  const [modal, setModal] = useState(null); // {fi, throwNum}
  const color = COLORS[player.colorIdx];

  const handlePick = (fi, throwNum, picked) => {
    const nf = frames.map((f,i) => {
      if (i !== fi) return f;
      if (fi < 9) return {...f,...picked};
      // 10th frame
      const newThrows = [...(f.throws||[{outcome:null,splitType:null},{outcome:null,splitType:null},{outcome:null,splitType:null}])];
      newThrows[throwNum] = picked;
      return {...f, throws:newThrows};
    });
    onUpdate(nf);
    setModal(null);
  };

  // Summary counts
  const counts = {X:0,spare:0,open:0,split:0};
  frames.forEach((f,fi) => {
    if (fi < 9) {
      if (isStrike(f.outcome)) counts.X++;
      else if (isSpare(f.outcome)) counts.spare++;
      else if (isOpen(f.outcome)) { counts.open++; if(f.outcome==="split-open") counts.split++; }
    } else {
      (f.throws||[]).forEach(t=>{ if(t&&isStrike(t.outcome)) counts.X++; });
    }
  });

  const getFsm = (o) => frameStyleMap[o] || frameStyleMap[null];

  // 10th frame: determine which throws are available
  const f10 = frames[9] || emptyFrame10();
  const t0 = (f10.throws||[])[0] || {outcome:null};
  const t1 = (f10.throws||[])[1] || {outcome:null};
  const t2 = (f10.throws||[])[2] || {outcome:null};
  // A 2nd ball only exists if the 1st earned a bonus (strike or spare) --
  // an open/split-open/miss5 1st attempt uses both its balls and ends the frame.
  const t0Bonus = isStrike(t0.outcome) || isSpare(t0.outcome);
  // A 3rd ball only exists if the 1st AND 2nd were both strikes (two fresh racks
  // in a row). If the 1st was a strike but the 2nd wasn't itself a strike, the
  // 2nd throw's outcome already used up both remaining balls -- no 3rd ball.
  // A spare on the 1st only ever earns exactly one bonus ball (the 2nd), never a 3rd.
  const has3rd = isStrike(t0.outcome) && isStrike(t1.outcome);

  return (
    <div className="sheet" style={{border:`1.5px solid ${color.bg}28`}}>
      <div className="sheet-header" style={{background:`linear-gradient(135deg,${color.bg}14,transparent)`,borderBottom:`1px solid ${color.bg}1a`}}>
        <div className="flex items-center gap-10">
          <div className="avatar" style={{width:32,height:32,background:color.bg,color:color.text,fontSize:15,boxShadow:`0 0 10px ${color.bg}50`}}>
            {player.name.charAt(0)}
          </div>
          <div>
            <div style={{fontSize:14,fontWeight:700}}>{player.name}</div>
            <div className="mono" style={{fontSize:10,color:"#444"}}>
              {counts.X>0?counts.X+"X ":""}{counts.spare>0?counts.spare+"/ ":""}{counts.open>0?counts.open+"— ":""}
              {player.average?" avg "+player.average:""}
            </div>
          </div>
        </div>
        {/* Score input */}
        <div className="flex items-center gap-8">
          <input type="number" placeholder="Score" value={gameScore||""} readOnly={readOnly} onChange={e=>!readOnly&&onScoreChange(e.target.value)}
            style={{width:70,padding:"5px 8px",borderRadius:8,background:"#080814",border:`1px solid ${color.bg}40`,color:"#FFE66D",fontSize:14,fontWeight:700,textAlign:"center",outline:"none",cursor:readOnly?"default":"text"}}/>
        </div>
      </div>

      <div className="frames-wrap">
        <div className="frames-row">
          {frames.slice(0,9).map((f,fi) => {
            const fsm = getFsm(f.outcome);
            return (
              <div key={fi} className="frame-col">
                <div className="frame-num">{fi+1}</div>
                <button className={"outcome-btn "+fsm.cls} onClick={()=>!readOnly&&setModal({fi,throwNum:0})} style={readOnly?{cursor:"default"}:undefined}>
                  <span className="outcome-sym" style={{color:fsm.symColor}}>{fsm.sym}</span>
                  {f.outcome==="split-spare"&&f.splitType==="710"&&<span style={{fontSize:7}}>👑</span>}
                  {f.outcome==="split-spare"&&f.splitType==="large"&&<span style={{fontSize:7}}>🎉</span>}
                  {f.outcome==="split-spare"&&f.splitType==="small"&&<span style={{fontSize:7}}>👏</span>}
                </button>
              </div>
            );
          })}

          {/* 10th frame — up to 3 cells */}
          <div className="frame-col f10">
            <div className="frame-num">10</div>
            <div className="f10-cells">
              {[t0,t1,t2].map((th,ti) => {
                // Only show 2nd if 1st earned a bonus ball; only show 3rd if eligible
                if (ti===1 && (!t0.outcome || !t0Bonus)) return null;
                if (ti===2 && (!t1.outcome || !has3rd)) return null;
                const fsm = getFsm(th.outcome);
                return (
                  <button key={ti} className={"f10-cell "+fsm.cls} onClick={()=>!readOnly&&setModal({fi:9,throwNum:ti})} style={readOnly?{cursor:"default"}:undefined}>
                    <span className="outcome-sym" style={{color:fsm.symColor,fontSize:13}}>{fsm.sym}</span>
                    {th.outcome==="split-spare"&&th.splitType==="710"&&<span style={{fontSize:7}}>👑</span>}
                    {th.outcome==="split-spare"&&th.splitType==="large"&&<span style={{fontSize:7}}>🎉</span>}
                    {th.outcome==="split-spare"&&th.splitType==="small"&&<span style={{fontSize:7}}>👏</span>}
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      </div>

      {modal && (
        <FramePicker
          frameIdx={modal.fi} throwNum={modal.throwNum}
          color={color}
          existingOutcome={modal.fi<9 ? frames[modal.fi].outcome : ((frames[9]||{}).throws||[])[modal.throwNum]}
          onPick={picked=>handlePick(modal.fi, modal.throwNum, picked)}
          onClose={()=>setModal(null)}
        />
      )}
    </div>
  );
}

// ─── Historical Scoresheets (read-only, for a closed week) ────────────────────
function WeekScoresheets({wk, players}) {
  const [open, setOpen] = useState(false);
  const [gi, setGi] = useState(0);
  if (!wk.playerGames || Object.keys(wk.playerGames).length===0) return null;

  const gameCount = Math.max(1, ...Object.values(wk.playerGames).map(g=>(g||[]).length));
  const nameFor = pid => {
    for (const g of wk.groups) {
      const c = g.contributions.find(c=>c.playerId===pid);
      if (c) return c.name;
    }
    const cur = players.find(p=>p.id===pid);
    return cur ? cur.name : "Player";
  };
  const colorIdxFor = pid => {
    const cur = players.find(p=>p.id===pid);
    return cur ? cur.colorIdx : pid%COLORS.length;
  };

  return (
    <div className="mt-8">
      <button onClick={()=>setOpen(o=>!o)} style={{width:"100%",padding:"8px",borderRadius:8,background:"rgba(78,205,196,0.08)",border:"1px solid rgba(78,205,196,0.25)",color:"#4ECDC4",fontWeight:700,fontSize:11,letterSpacing:1,textTransform:"uppercase"}}>
        🎳 {open?"Hide":"View"} Scoresheets
      </button>
      {open && (
        <div className="mt-8">
          {gameCount>1 && (
            <div className="game-tabs mb-8">
              {Array.from({length:gameCount},(_,i)=>(
                <button key={i} className={"game-tab"+(gi===i?" active":"")} onClick={()=>setGi(i)}>G{i+1}</button>
              ))}
            </div>
          )}
          {wk.groups.map(g=>(
            <div key={g.potKey} className="mb-14">
              <div style={{fontSize:10,fontWeight:700,color:g.potKey===MAIN_KEY?"#FFE66D":"#C77DFF",letterSpacing:2,textTransform:"uppercase",marginBottom:6}}>{g.label}</div>
              {g.playerIds.map(pid=>{
                const frames=(wk.playerGames[pid]||[])[gi]||emptyGame();
                const score=((wk.gameScores||{})[pid]||{})[gi]||"";
                const fakePlayer={id:pid,name:nameFor(pid),colorIdx:colorIdxFor(pid)};
                return <ScoreSheet key={pid} player={fakePlayer} frames={frames} gameScore={score} readOnly={true}/>;
              })}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ─── Week History & Payments (shared by Setup screen and the Pot tab) ─────────
function WeekHistoryCard({weekHistory, players, expandedWeek, setExpandedWeek, recPay}) {
  if (weekHistory.length === 0) return null;
  return (
    <div className="card">
      <div className="section-label mb-14" style={{color:"#4ECDC4"}}>Week History & Payments</div>
      {[...weekHistory].reverse().map(wk=>{
        const isOpen=expandedWeek===wk.weekNum;
        // Recompute carryIn/amountOwed live so a retroactive payment on an
        // earlier week is reflected here immediately, not just going forward.
        const groups=wk.groups.map(g=>liveGroup(weekHistory,wk,g));
        const settled=groups.every(g=>Math.abs(g.totalOwed-(g.totalPaid||0))<0.01);
        return(
          <div key={wk.weekNum} className="week-row">
            <button className="week-header" onClick={()=>setExpandedWeek(isOpen?null:wk.weekNum)}>
              <div className="flex items-center gap-10 wrap">
                <span style={{fontWeight:700,color:"#4ECDC4",fontSize:13}}>Week {wk.weekNum}</span>
                <span className="mono" style={{fontSize:11,color:"#444"}}>{wk.date}</span>
                {groups.some(g=>g.potKey!==MAIN_KEY)&&<span style={{fontSize:9,fontWeight:700,color:"#C77DFF",background:"rgba(199,125,255,0.1)",padding:"1px 6px",borderRadius:8}}>Side Pot</span>}
                <span style={{fontSize:9,fontWeight:700,color:settled?"#06D6A0":"#FF6B35",background:settled?"rgba(6,214,160,0.1)":"rgba(255,107,53,0.1)",padding:"1px 6px",borderRadius:8}}>{settled?"✓ Settled":"Pending"}</span>
              </div>
              <div className="flex gap-8 items-center">
                <div className="text-right">{groups.map(g=><div key={g.potKey} style={{fontSize:11,fontWeight:700,color:g.potKey===MAIN_KEY?"#FFE66D":"#C77DFF"}}>${(g.totalPaid||0).toFixed(2)}<span style={{color:"#333",fontSize:9}}>/${g.totalOwed.toFixed(2)}</span></div>)}</div>
                <span style={{color:"#444",fontSize:12}}>{isOpen?"▲":"▼"}</span>
              </div>
            </button>
            {isOpen&&(
              <div className="week-body">
                {groups.map((g,gi)=>(
                  <div key={g.potKey} style={{marginBottom:gi<groups.length-1?16:0}}>
                    <div style={{fontWeight:700,fontSize:10,color:g.potKey===MAIN_KEY?"#FFE66D":"#C77DFF",letterSpacing:2,textTransform:"uppercase",marginBottom:8}}>{g.label}</div>
                    {g.contributions.map(c=>{
                      const dr=wk.dotResults&&wk.dotResults[c.playerId];
                      const byGame=(dr&&dr.byGame)||[];
                      const manual=(dr&&dr.manualDots)||0;
                      const hasBreakdown=byGame.some(d=>d>0)||manual>0;
                      return(
                        <div key={c.playerId} className="mb-8">
                          <PayRow c={c} players={players} onPay={amt=>recPay(wk.weekNum,g.potKey,c.playerId,amt)}/>
                          {hasBreakdown&&(
                            <div style={{display:"flex",gap:6,flexWrap:"wrap",padding:"4px 4px 0"}}>
                              {byGame.map((d,gi2)=>d>0&&(
                                <span key={gi2} style={{fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:6,background:"#080814",color:"#888"}}>Game {gi2+1}: {d} dot{d===1?"":"s"}</span>
                              ))}
                              {manual>0&&<span style={{fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:6,background:"#080814",color:"#888"}}>Manual: {manual} dot{manual===1?"":"s"}</span>}
                            </div>
                          )}
                        </div>
                      );
                    })}
                    <div className="flex justify-between" style={{padding:"6px 10px",background:"#080814",borderRadius:8,fontSize:12}}>
                      <span style={{color:"#444"}}>Collected</span>
                      <span style={{fontWeight:700,color:g.potKey===MAIN_KEY?"#FFE66D":"#C77DFF"}}>${(g.totalPaid||0).toFixed(2)} / ${g.totalOwed.toFixed(2)}</span>
                    </div>
                  </div>
                ))}
                <WeekScoresheets wk={wk} players={players}/>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ─── Pay Row ──────────────────────────────────────────────────────────────────
function PayRow({c,players,onPay}) {
  const [inp,setInp]=useState("");
  const remaining=Math.max(0,(c.amountOwed||0)-(c.amountPaid||0));
  const settled=remaining<0.005;
  const p=players.find(pl=>pl.id===c.playerId);
  const col=p?COLORS[p.colorIdx]:{bg:"#555"};
  return (
    <div className="pay-row" style={{background:settled?"rgba(6,214,160,0.03)":"rgba(255,107,53,0.03)",border:`1px solid ${settled?"rgba(6,214,160,0.12)":"rgba(255,107,53,0.12)"}`}}>
      <div className="flex justify-between items-center" style={{marginBottom:settled?0:8}}>
        <div className="flex items-center gap-8 wrap">
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <div style={{width:8,height:8,borderRadius:"50%",background:col.bg,flexShrink:0}}/>
            <span style={{fontSize:13,fontWeight:700}}>{c.name}</span>
          </div>
          <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
            {c.dotsOwed>0&&<span style={{fontSize:10,padding:"1px 6px",borderRadius:8,color:"#FFE66D",background:"rgba(255,230,109,0.1)"}}>{c.dots} dots = ${c.dotsOwed.toFixed(2)}</span>}

// ─── Excel Export ─────────────────────────────────────────────────────────────
function exportToExcel(players, weekHistory) {
  const wb = XLSX.utils.book_new();

  // ── Sheet 1: Season Summary ────────────────────────────────────────────────
  const fairSplit = fairPayoutSplit(weekHistory);
  const mainPotTotal = weekHistory.reduce((t,wk)=>{ const g=wk.groups.find(g=>g.potKey===MAIN_KEY); return t+(g?g.totalPaid||0:0); },0);
  const sidePotsTotal = weekHistory.reduce((t,wk)=>t+wk.groups.filter(g=>g.potKey!==MAIN_KEY).reduce((s,g)=>s+(g.totalPaid||0),0),0);
  const summaryData = [
    ["DOT GAME — SEASON SUMMARY"],
    [],
    ["Player","Avg","Weeks Played","Total Dots","Total Paid","Main Pot Paid","Side Pot Paid","Balance","Fair Payout (Main)","Fair Payout (Side)","Fair Payout (Total)"],
    ...players.map(p=>{
      // Paid/balance always recomputed from weekHistory, never the cached
      // p.paid/p.balance -- see currentBalance's comment for why.
      const potKeys = allPotKeysForPlayer(weekHistory,p.id);
      const mainPaid = totalPaidByPot(weekHistory,p.id,MAIN_KEY);
      const totalPaid = potKeys.reduce((t,k)=>t+totalPaidByPot(weekHistory,p.id,k),0);
      const sidePaid = totalPaid - mainPaid;
      const balance = potKeys.reduce((t,k)=>t+currentBalance(weekHistory,p.id,k),0);
      const weeksPlayed = weekHistory.filter(wk=>wk.groups.some(g=>g.contributions.some(c=>c.playerId===p.id))).length;
      const totalDots = weekHistory.reduce((t,wk)=>{
        const c = wk.groups.flatMap(g=>g.contributions).find(c=>c.playerId===p.id);
        return t + (c?c.dots:0);
      },0);
      const fair = fairSplit[p.id]||{main:0,side:0,total:0};
      return [p.name, p.average||"", weeksPlayed, totalDots, totalPaid.toFixed(2), mainPaid.toFixed(2), sidePaid.toFixed(2), balance.toFixed(2), fair.main.toFixed(2), fair.side.toFixed(2), fair.total.toFixed(2)];
    }),
    [],
    ["","","","","","","","","Main Pot Collected:", mainPotTotal.toFixed(2)],
    ["","","","","","","","","Side Pots Collected:", sidePotsTotal.toFixed(2)],
    [],
    ["Fair Payout (Main/Side) = that pot's collected money split equally among only the players who were actually in it each week -- a sub who played fewer weeks only shares in the weeks they played."],
  ];
  const ws1 = XLSX.utils.aoa_to_sheet(summaryData);
  ws1["!cols"] = [{wch:20},{wch:8},{wch:14},{wch:12},{wch:12},{wch:14},{wch:14},{wch:10},{wch:16},{wch:16},{wch:16}];
  XLSX.utils.book_append_sheet(wb, ws1, "Season Summary");

  // ── Sheet 2: Week by Week ──────────────────────────────────────────────────
  const weekRows = [["Week","Date","Player","Pot","Dots","Owed","Paid","Remaining"]];
  weekHistory.forEach(wk=>{
    wk.groups.forEach(g=>{
      g.contributions.forEach(c=>{
        const remaining = Math.max(0,(c.amountOwed||0)-(c.amountPaid||0));
        weekRows.push([wk.weekNum, wk.date, c.name, g.label, c.dots, c.amountOwed.toFixed(2), (c.amountPaid||0).toFixed(2), remaining.toFixed(2)]);
      });
    });
  });
  const ws2 = XLSX.utils.aoa_to_sheet(weekRows);
  ws2["!cols"] = [{wch:6},{wch:12},{wch:18},{wch:22},{wch:8},{wch:8},{wch:8},{wch:10}];
  XLSX.utils.book_append_sheet(wb, ws2, "Week by Week");

  // ── Sheet 3: Event Stats ───────────────────────────────────────────────────
  const statMap = {};
  players.forEach(p=>{statMap[p.id]={name:p.name,opens:0,splits:0,smallPicks:0,largePicks:0,sevenTen:0,turkeys:0,streaks:0,hung:0,miss5:0,gutters:0,wrongLane:0,outOfTurn:0};});
  weekHistory.forEach(wk=>{
    if(!wk.dotResults)return;
    Object.entries(wk.dotResults).forEach(([pid,dr])=>{
      const a=statMap[parseInt(pid)];if(!a)return;
      (dr.events||[]).forEach(ev=>{
        if(ev.icon==="😬"&&!ev.label.includes("from"))a.opens++;
        if(ev.icon==="🎳"&&!ev.label.includes("from"))a.splits++;
        if(ev.icon==="👏"&&!ev.label.includes("from"))a.smallPicks++;
        if(ev.icon==="🎉"&&!ev.label.includes("from"))a.largePicks++;
        if(ev.icon==="👑"&&!ev.label.includes("from"))a.sevenTen++;
        if(ev.icon==="🦃"&&!ev.label.includes("from"))a.turkeys++;
        if(ev.icon==="🔥"&&!ev.label.includes("from"))a.streaks++;
        if(ev.icon==="🪝"&&!ev.label.includes("from"))a.hung++;
        if(ev.icon==="🎯"&&!ev.label.includes("from"))a.miss5++;
        if(ev.icon==="💥")a.gutters++;
        if(ev.icon==="🔀")a.wrongLane++;
        if(ev.icon==="⏭️")a.outOfTurn++;
      });
    });
  });
  const statRows = [
    ["Player","Opens","Splits Left","Turkeys","4+ Streaks","Hung","7-10 Picks","Small Splits Made","Large Splits Made","Missed 5-Pin","Wrong Lane","Out of Turn"],
    ...Object.values(statMap).map(s=>[s.name,s.opens,s.splits,s.turkeys,s.streaks,s.hung,s.sevenTen,s.smallPicks,s.largePicks,s.miss5,s.wrongLane,s.outOfTurn])
  ];
  const ws3 = XLSX.utils.aoa_to_sheet(statRows);
  ws3["!cols"] = [{wch:18},...Array(11).fill({wch:12})];
  XLSX.utils.book_append_sheet(wb, ws3, "Event Stats");

  // ── Sheet 4: Scores ────────────────────────────────────────────────────────
  // Build per-week per-game scores if available
  const scoreRows = [["Week","Date","Player","Game 1","Game 2","Game 3","Series"]];
  weekHistory.forEach(wk=>{
    if (!wk.gameScores) return;
    players.forEach(p=>{
      const gs = wk.gameScores[p.id]||[];
      const g1=parseInt(gs[0])||"",g2=parseInt(gs[1])||"",g3=parseInt(gs[2])||"";
      const series=[g1,g2,g3].filter(g=>g!=="").reduce((t,g)=>t+g,0);
      if(g1!==""||g2!==""||g3!=="") scoreRows.push([wk.weekNum,wk.date,p.name,g1,g2,g3,series||""]);
    });
  });
  const ws4 = XLSX.utils.aoa_to_sheet(scoreRows);
  ws4["!cols"] = [{wch:6},{wch:12},{wch:18},{wch:9},{wch:9},{wch:9},{wch:9}];
  XLSX.utils.book_append_sheet(wb, ws4, "Scores");

  XLSX.writeFile(wb, "DotGame_Season.xlsx");
}

// ─── Main App ─────────────────────────────────────────────────────────────────
function App() {
  const [state,setState]=useState(()=>load()||initState());
  const [tab,setTab]=useState("game");
  const [subName,setSubName]=useState("");
  const [subAvg,setSubAvg]=useState("");
  const [editAvg,setEditAvg]=useState({});
  const [editName,setEditName]=useState({});
  const [newRegName,setNewRegName]=useState("");
  const [newRegAvg,setNewRegAvg]=useState("");
  const [absentDraft,setAbsentDraft]=useState(new Set());
  const [weekNumDraft,setWeekNumDraft]=useState(null); // null = use auto default
  const [dateDraft,setDateDraft]=useState(null); // null = use auto default (today)
  const [expandedWeek,setExpandedWeek]=useState(null);
  const [showClose,setShowClose]=useState(false);
  const [showDebug,setShowDebug]=useState(false);
  const [activeGame,setActiveGame]=useState(0);
  const [statPlayer,setStatPlayer]=useState(null);
  const [statWeek,setStatWeek]=useState(null);

  const {players,weekHistory,session}=state;
  useEffect(()=>save(state),[state]);
  const upd=useCallback(fn=>setState(s=>({...s,...fn(s)})),[]);

  const allKeys=allPotKeys(weekHistory);
  const mainTotal=potTotal(weekHistory,MAIN_KEY);
  const sideTotals=allKeys.filter(k=>k!==MAIN_KEY).map(k=>({key:k,total:potTotal(weekHistory,k)}));
  const autoWeekNum=weekHistory.length>0?weekHistory[weekHistory.length-1].weekNum+1:1;
  const effectiveWeekNum=weekNumDraft!==null&&weekNumDraft!==""?parseInt(weekNumDraft):autoWeekNum;
  const effectiveDate=dateDraft!==null&&dateDraft!==""?dateDraft:todayISO();
  const absentSet=new Set((session||{}).absentIds||[]);
  const presentPlayers=players.filter(p=>!absentSet.has(p.id));
  const absentPlayers =players.filter(p=> absentSet.has(p.id));
  const gameCount=session&&players.length>0?((session.playerGames[players[0].id]||[emptyGame()]).length):1;
  const missingAvg=players.filter(p=>p.average==null);

  // Players who were removed from the roster (✕) but still appear in closed
  // weekHistory. Their week-by-week data was never touched -- their balance
  // owed/paid is always recomputed fresh from weekHistory (currentBalance),
  // so it's correct regardless of when they were removed or restored.
  const removedPlayers = (() => {
    const currentIds = new Set(players.map(p=>p.id));
    const found = new Map();
    weekHistory.forEach(wk=>{
      wk.groups.forEach(g=>{
        g.contributions.forEach(c=>{
          if (currentIds.has(c.playerId)) return;
          if (!found.has(c.playerId)) found.set(c.playerId, {id:c.playerId, name:c.name});
          found.get(c.playerId).name = c.name;
        });
      });
    });
    return [...found.values()].map(rec=>({...rec, potKeys:allPotKeysForPlayer(weekHistory,rec.id)}));
  })();
  const restorePlayer = (rec) => {
    upd(s=>({players:[...s.players,{id:rec.id,name:rec.name,average:null,colorIdx:s.players.length%COLORS.length,isRegular:true,stats:{},balance:{},paid:{}}]}));
  };

  // ── Roster ────────────────────────────────────────────────────────────────
  const updateAvg=(id,val)=>{ const avg=val===""?null:parseInt(val); upd(s=>({players:s.players.map(p=>p.id===id?{...p,average:isNaN(avg)?null:avg}:p)})); setEditAvg(prev=>{const n={...prev};delete n[id];return n;}); };
  const saveEditName=(id)=>{ const name=(editName[id]||"").trim(); if(name)upd(s=>({players:s.players.map(p=>p.id===id?{...p,name}:p)})); setEditName(prev=>{const n={...prev};delete n[id];return n;}); };
  const addSub=()=>{ if(!subName.trim())return; const idx=players.length; upd(s=>({players:[...s.players,{id:Date.now(),name:subName.trim(),average:subAvg?parseInt(subAvg):null,colorIdx:idx%COLORS.length,isRegular:false,stats:{},balance:{},paid:{}}]})); setSubName("");setSubAvg(""); };
  const addRegular=()=>{ if(!newRegName.trim())return; const idx=players.length; upd(s=>({players:[...s.players,{id:Date.now(),name:newRegName.trim(),average:newRegAvg?parseInt(newRegAvg):null,colorIdx:idx%COLORS.length,isRegular:true,stats:{},balance:{},paid:{}}]})); setNewRegName("");setNewRegAvg(""); };
  const removePlayer=(id,isSub)=>{ if(!window.confirm("Remove "+(isSub?"sub":"player")+" from lineup? History stays."))return; upd(s=>({players:s.players.filter(p=>p.id!==id)})); };
  // Reorders within the same group (regulars vs subs) -- this is also the
  // bowling order used for hung/team-streak dot logic, so it should match
  // the real order they bowl in. Never touches id/name/history.
  const movePlayer=(id,dir)=>{
    upd(s=>{
      const arr=[...s.players];
      const i=arr.findIndex(p=>p.id===id);
      if(i<0)return s;
      const group=arr[i].isRegular;
      let j=i+dir;
      while(j>=0&&j<arr.length&&arr[j].isRegular!==group)j+=dir;
      if(j<0||j>=arr.length)return s;
      [arr[i],arr[j]]=[arr[j],arr[i]];
      return{players:arr};
    });
  };

  // ── Session ───────────────────────────────────────────────────────────────
  const startSession=()=>{
    if(!players.length)return;
    if(missingAvg.length>0){ window.alert("Set an average for everyone before starting the week:\n"+missingAvg.map(p=>"• "+p.name).join("\n")); return; }
    const wkNum=effectiveWeekNum;
    const wkDate=effectiveDate;
    upd(s=>{
      const pg={};
      s.players.forEach(p=>{ pg[p.id]=[emptyGame()]; });
      return {session:{weekNum:wkNum,date:wkDate,gameNum:1,absentIds:[...absentDraft],playerGames:pg,gameScores:{},manualDots:[],payments:{}}};
    });
    setAbsentDraft(new Set());
    setWeekNumDraft(null);
    setDateDraft(null);
    setActiveGame(0);
    setTab("game");
  };

  const nextGame=()=>{
    upd(s=>{
      if(!s.session)return s;
      const pg={...s.session.playerGames};
      s.players.forEach(p=>{ pg[p.id]=[...(pg[p.id]||[emptyGame()]),emptyGame()]; });
      return{session:{...s.session,gameNum:s.session.gameNum+1,playerGames:pg}};
    });
    setActiveGame(g=>g+1);
  };

  const updateFrames=useCallback((pid,gi,nf)=>{
    upd(s=>{ if(!s.session)return s; const pg={...s.session.playerGames}; const games=[...(pg[pid]||[])]; games[gi]=nf; pg[pid]=games; return{session:{...s.session,playerGames:pg}}; });
  },[upd]);

  const updateScore=useCallback((pid,gi,val)=>{
    upd(s=>{ if(!s.session)return s; const gs={...(s.session.gameScores||{})}; if(!gs[pid])gs[pid]={}; gs[pid][gi]=val; return{session:{...s.session,gameScores:gs}}; });
  },[upd]);

  const addManual=(pid,dots,label,icon)=>{ upd(s=>({session:{...s.session,manualDots:[...(s.session.manualDots||[]),{pid,dots,label,icon}]}})); };

  // Compute series total per player for current session
  const seriesTotal=(pid)=>{
    if(!session)return null;
    const gs=session.gameScores||{};
    const scores=Object.values(gs[pid]||{}).map(v=>parseInt(v)).filter(v=>!isNaN(v));
    return scores.length>0?scores.reduce((t,v)=>t+v,0):null;
  };

  // ── Close Week ────────────────────────────────────────────────────────────
  const closeWeek=()=>{
    upd(s=>{
      if(!s.session)return s;
      const abs=new Set(s.session.absentIds);
      let dr;
      try { dr=analyzeDots(s.players,s.session); } catch(e) { console.error('closeWeek analyzeDots error:', e); window.alert("Couldn't close the week — something went wrong computing dots. Your entries are still saved; please try again or reload."); return s; }
      // Carry-in is always recomputed from the ledger (weekHistory so far), never
      // read from the cached p.balance snapshot -- that cache can go stale the
      // moment a payment is logged retroactively against an older week (see
      // currentBalance's comment above).
      const pBal=(p,key)=>currentBalance(s.weekHistory,p.id,key);
      const paidSoFar=pid=>(s.session.payments||{})[pid]||0;
      const mkGroup=(pList,potKey)=>{
        const contribs=pList.map(p=>{
          const r=dr[p.id]||{dots:0,dollarDiscount:0};
          const dots=Math.max(0,r.dots);
          const dotsOwed=owedFor(dots,r.dollarDiscount||0);
          const carryIn=pBal(p,potKey); // positive = owes from prior weeks, negative = credit
          const amountOwed=Math.max(0, dotsOwed + carryIn); // net total owed this week
          return{playerId:p.id,name:p.name,dots,dotsOwed,carryIn,amountOwed,amountPaid:paidSoFar(p.id)};
        });
        return{potKey,label:potKey===MAIN_KEY?"Main Pot":"Side Pot ("+pList.map(p=>p.name).join(", ")+")",
          playerIds:pList.map(p=>p.id),contributions:contribs,
          totalOwed:contribs.reduce((t,c)=>t+c.amountOwed,0),totalPaid:contribs.reduce((t,c)=>t+c.amountPaid,0)};
      };
      // One pot only: absent players sit the week out entirely -- no group,
      // no contribution, no payout share. Their balance/paid are left untouched.
      const present=s.players.filter(p=>!abs.has(p.id));
      const groups=present.length>0?[mkGroup(present,MAIN_KEY)]:[];
      const newPlayers=s.players.map(p=>{
        if(abs.has(p.id)) return p;
        const key=MAIN_KEY;
        const r=dr[p.id]||{dots:0,dollarDiscount:0};
        const dotsOwed=owedFor(Math.max(0,r.dots),r.dollarDiscount||0);
        const carryIn=pBal(p,key);
        const paid=paidSoFar(p.id);
        // New balance = this week's dots owed + prior carry, minus whatever was already paid live this week
        const newBalance=dotsOwed + carryIn - paid;
        return{...p,balance:{...(p.balance||{}),[key]:newBalance},paid:{...(p.paid||{}),[key]:((p.paid||{})[key]||0)+paid}};
      });
      return{players:newPlayers,session:null,weekHistory:[...s.weekHistory,{weekNum:s.session.weekNum,date:s.session.date?fmtDate(s.session.date):new Date().toLocaleDateString(),groups,dotResults:dr,gameScores:s.session.gameScores||{},playerGames:s.session.playerGames||{}}]};
    });
    setShowClose(false);
  };

  // ── Payments ──────────────────────────────────────────────────────────────
  const recPay=(wkNum,potKey,pid,amount)=>{
    const amt=parseFloat(amount); if(isNaN(amt)||amt<=0)return;
    upd(s=>{
      const newHistory=s.weekHistory.map(wk=>{ if(wk.weekNum!==wkNum)return wk; const ng=wk.groups.map(g=>{ if(g.potKey!==potKey)return g; const nc=g.contributions.map(c=>c.playerId===pid?{...c,amountPaid:(c.amountPaid||0)+amt}:c); return{...g,contributions:nc,totalPaid:nc.reduce((t,c)=>t+(c.amountPaid||0),0)}; }); return{...wk,groups:ng}; });
      const np=s.players.map(p=>{ if(p.id!==pid)return p; return{...p,balance:{...(p.balance||{}),[potKey]:((p.balance||{})[potKey]||0)-amt},paid:{...(p.paid||{}),[potKey]:((p.paid||{})[potKey]||0)+amt}}; });
      return{weekHistory:newHistory,players:np};
    });
  };

  // Corrective tool: move ONE closed week's entire record for a player (dots,
  // dollars owed/paid, pot membership, scoresheet) from one playerId to
  // another -- for fixing a specific week that got attributed to the wrong
  // current roster record (e.g. two players' names got swapped between
  // weeks, splitting one real person's history across two ids). Only
  // touches the single named week; every other week is untouched.
  // If newPid ALSO has data in that same week (the common case -- both
  // people bowled that night), this SWAPS the two records instead of
  // overwriting one, so neither week ever ends up with two rows under the
  // same id (which would silently drop one of them from every total).
  const reassignWeekPlayer=(wkNum,oldPid,newPid)=>{
    const newPlayer=players.find(p=>p.id===newPid);
    const oldPlayerNow=players.find(p=>p.id===oldPid); // whoever currently holds oldPid, if anyone
    if(!newPlayer)return;
    upd(s=>{
      const swapKeyed=obj=>{
        if(!obj||!(String(oldPid) in obj))return obj;
        const n={...obj};
        const hasNew=String(newPid) in obj;
        const oldVal=n[oldPid];
        if(hasNew){ const newVal=n[newPid]; n[oldPid]=newVal; n[newPid]=oldVal; }
        else { delete n[oldPid]; n[newPid]=oldVal; }
        return n;
      };
      const newHistory=s.weekHistory.map(wk=>{
        if(wk.weekNum!==wkNum)return wk;
        return{
          ...wk,
          groups:wk.groups.map(g=>{
            const hasOld=g.contributions.some(c=>c.playerId===oldPid);
            if(!hasOld)return g;
            const hasNewAlready=g.contributions.some(c=>c.playerId===newPid);
            return{
              ...g,
              playerIds:g.playerIds.map(pid=>{
                if(pid===oldPid)return newPid;
                if(hasNewAlready&&pid===newPid)return oldPid;
                return pid;
              }),
              contributions:g.contributions.map(c=>{
                if(c.playerId===oldPid)return{...c,playerId:newPid,name:newPlayer.name};
                if(hasNewAlready&&c.playerId===newPid)return{...c,playerId:oldPid,name:oldPlayerNow?oldPlayerNow.name:c.name};
                return c;
              })
            };
          }),
          dotResults:swapKeyed(wk.dotResults),
          gameScores:swapKeyed(wk.gameScores),
          playerGames:swapKeyed(wk.playerGames)
        };
      });
      return{weekHistory:newHistory};
    });
  };

  // For a closed week, check whether a player's series (their own stored
  // game scores vs their CURRENT average) should have triggered the 100+
  // under/over-average rule -- and whether that already shows up in what
  // was actually charged. A rule that's fixed/added after a week already
  // closed never gets replayed against that week automatically (closeWeek
  // only ever runs once, at close time) -- this lets a specific missed
  // case be corrected deliberately, without touching anything else in
  // that week (hung, streaks, opens, other players, etc. all stay as-is).
  const checkSeriesRule=(wk,p)=>{
    if(!p.average)return null;
    const gs=(wk.gameScores||{})[p.id]||{};
    const entries=Object.values(gs).map(v=>parseInt(v)).filter(v=>!isNaN(v));
    if(entries.length===0)return null;
    const seriesTotal=entries.reduce((t,v)=>t+v,0);
    const expected=p.average*entries.length;
    const dr=(wk.dotResults||{})[p.id];
    const hasOverEvent=dr&&(dr.events||[]).some(ev=>/over average for the series/.test(ev.label||""));
    const hasUnderEvent=dr&&(dr.events||[]).some(ev=>/under average for the series/.test(ev.label||""));
    const over=seriesTotal-expected, under=expected-seriesTotal;
    if(over>=100&&!hasOverEvent)return{kind:"over",seriesTotal,expected};
    if(under>=100&&!hasUnderEvent)return{kind:"under",seriesTotal,expected};
    return null;
  };
  const applySeriesFix=(wkNum,pid,kind,seriesTotal,expected)=>{
    upd(s=>{
      const newHistory=s.weekHistory.map(wk=>{
        if(wk.weekNum!==wkNum)return wk;
        const oldDr=(wk.dotResults||{})[pid]||{dots:0,dollarDiscount:0,events:[],byGame:[],manualDots:0};
        const label=kind==="over"
          ?"100+ over average for the series ("+seriesTotal+" vs "+expected+") — $10 off!"
          :"100+ under average for the series ("+seriesTotal+" vs "+expected+")";
        const icon=kind==="over"?"🌟":"🤦";
        const newDots=kind==="under"?oldDr.dots+20:oldDr.dots;
        const newDiscount=kind==="over"?(oldDr.dollarDiscount||0)+10:(oldDr.dollarDiscount||0);
        const newDr={...oldDr,dots:newDots,dollarDiscount:newDiscount,events:[...(oldDr.events||[]),{label,icon,dots:kind==="under"?20:0,dollars:kind==="over"?10:undefined}]};
        const newGroups=wk.groups.map(g=>{
          if(!g.contributions.some(c=>c.playerId===pid))return g;
          return{...g,contributions:g.contributions.map(c=>c.playerId===pid?{...c,dots:newDots,dotsOwed:owedFor(newDots,newDiscount)}:c)};
        });
        return{...wk,dotResults:{...(wk.dotResults||{}),[pid]:newDr},groups:newGroups};
      });
      return{weekHistory:newHistory};
    });
  };

  // Log a payment against the CURRENT (still-open) week -- doesn't require closing.
  // Carried into weekHistory automatically once the week is eventually closed.
  const payNow=(pid,amount)=>{
    const amt=parseFloat(amount); if(isNaN(amt)||amt<=0)return;
    upd(s=>{
      if(!s.session)return s;
      const payments={...(s.session.payments||{})};
      payments[pid]=(payments[pid]||0)+amt;
      return{session:{...s.session,payments}};
    });
  };

  // Live (not-yet-closed) per-player owed/paid, for the "This Week" payments card.
  const liveContribution=(p)=>{
    const r=(liveDots&&liveDots[p.id])||{dots:0,dollarDiscount:0};
    const dots=Math.max(0,r.dots);
    const dotsOwed=owedFor(dots,r.dollarDiscount||0);
    // One pot only: this card is only ever shown for present players.
    // Recomputed from the ledger, not the cached p.balance (see currentBalance).
    const carryIn=currentBalance(weekHistory,p.id,MAIN_KEY);
    const amountOwed=Math.max(0,dotsOwed+carryIn);
    const amountPaid=(session.payments||{})[p.id]||0;
    return{playerId:p.id,name:p.name,dots,dotsOwed,carryIn,amountOwed,amountPaid};
  };

  const resetSeason=()=>{ if(!window.confirm("Reset entire season?"))return; setState({...initState(),players:players.map(p=>({...p,stats:{},balance:{},paid:{}}))}); };

  // ── Roster Row ────────────────────────────────────────────────────────────
  const RosterRow=({p,index,isSub,isFirst,isLast})=>{
    const c=COLORS[p.colorIdx];
    const editingAvgNow=editAvg.hasOwnProperty(p.id);
    const editingNameNow=editName.hasOwnProperty(p.id);
    return(
      <div className="roster-row" style={{background:isSub?"rgba(247,37,133,0.06)":c.bg+"0a",border:`1px solid ${isSub?"rgba(247,37,133,0.2)":c.bg+"25"}`}}>
        <div className="flex" style={{flexDirection:"column",gap:2,flexShrink:0}}>
          <button onClick={()=>movePlayer(p.id,-1)} disabled={isFirst} title="Move up (bowling order)" style={{padding:"1px 5px",borderRadius:5,background:"transparent",border:"1px solid #2a2a3e",color:isFirst?"#2a2a3e":"#888",fontSize:10,lineHeight:1.4,cursor:isFirst?"default":"pointer"}}>▲</button>
          <button onClick={()=>movePlayer(p.id,1)} disabled={isLast} title="Move down (bowling order)" style={{padding:"1px 5px",borderRadius:5,background:"transparent",border:"1px solid #2a2a3e",color:isLast?"#2a2a3e":"#888",fontSize:10,lineHeight:1.4,cursor:isLast?"default":"pointer"}}>▼</button>
        </div>
        <div className="avatar" style={{width:isSub?32:34,height:isSub?32:34,background:c.bg,color:c.text,fontSize:isSub?14:15,flexShrink:0}}>{isSub?p.name.charAt(0):index+1}</div>
        <div className="flex-1">
          {editingNameNow?(
            <div className="flex items-center gap-6">
              <input autoFocus value={editName[p.id]} onChange={e=>setEditName(prev=>({...prev,[p.id]:e.target.value}))} onKeyDown={e=>{if(e.key==="Enter")saveEditName(p.id);if(e.key==="Escape"){const n={...editName};delete n[p.id];setEditName(n);}}} style={{flex:1,padding:"4px 8px",borderRadius:6,background:"#080814",border:`1px solid ${c.bg}80`,color:"#fff",fontSize:13,outline:"none"}}/>
              <button onClick={()=>saveEditName(p.id)} style={{padding:"4px 10px",borderRadius:6,background:c.bg,border:"none",color:c.text,fontSize:11,fontWeight:700}}>SAVE</button>
              <button onClick={()=>{const n={...editName};delete n[p.id];setEditName(n);}} style={{padding:"4px 8px",borderRadius:6,background:"transparent",border:"1px solid #333",color:"#666",fontSize:11}}>✕</button>
            </div>
          ):(
            <div className="flex items-center gap-6">
              <span style={{fontSize:14,fontWeight:700}}>{p.name}</span>
              {isSub&&<span style={{fontSize:10,color:"#F72585",fontWeight:700}}>SUB</span>}
              <button onClick={()=>setEditName(prev=>({...prev,[p.id]:p.name}))} style={{background:"transparent",border:"none",padding:0,fontSize:11,color:"#333"}}>✏️</button>
            </div>
          )}
          {editingAvgNow?(
            <div className="flex items-center gap-6 mt-4">
              <input autoFocus type="number" value={editAvg[p.id]} placeholder="Avg" onChange={e=>setEditAvg(prev=>({...prev,[p.id]:e.target.value}))} onKeyDown={e=>{if(e.key==="Enter")updateAvg(p.id,editAvg[p.id]);}} style={{width:90,padding:"4px 8px",borderRadius:6,background:"#080814",border:`1px solid ${c.bg}60`,color:"#fff",fontSize:13,outline:"none"}}/>
              <button onClick={()=>updateAvg(p.id,editAvg[p.id])} style={{padding:"4px 10px",borderRadius:6,background:c.bg,border:"none",color:c.text,fontSize:11,fontWeight:700}}>SAVE</button>
              <button onClick={()=>{const n={...editAvg};delete n[p.id];setEditAvg(n);}} style={{padding:"4px 8px",borderRadius:6,background:"transparent",border:"1px solid #333",color:"#666",fontSize:11}}>✕</button>
            </div>
          ):(
            <button onClick={()=>setEditAvg(prev=>({...prev,[p.id]:p.average||""}))} style={{background:"transparent",border:"none",padding:0,display:"flex",alignItems:"center",gap:5,marginTop:2}}>
              <span className="mono" style={{fontSize:11,color:p.average?c.bg:"#444"}}>{p.average?"Avg "+p.average:"Tap to set avg"}</span>
              <span style={{fontSize:10,color:"#333"}}>✏️</span>
            </button>
          )}
        </div>
        <button onClick={()=>removePlayer(p.id,isSub)} style={{padding:"4px 10px",borderRadius:6,background:"transparent",border:"1px solid rgba(255,68,68,0.2)",color:"#ff4444",fontSize:11,flexShrink:0}}>✕</button>
      </div>
    );
  };

  // ─── SETUP SCREEN ───────────────────────────────────────────────────────────
  if(!session) return(
    <div id="app" style={{paddingBottom:80}}>
      <div style={{background:"linear-gradient(135deg,#0f0f24,#14102a)",borderBottom:"1px solid rgba(255,255,255,0.06)",padding:"20px 20px 16px"}}>
        <div style={{fontSize:26,fontWeight:700,color:"#FF6B35",letterSpacing:2,textTransform:"uppercase"}}>🎳 Dot Game</div>
        <div className="mono" style={{fontSize:10,color:"#444",letterSpacing:3,marginTop:2,textTransform:"uppercase"}}>Week {effectiveWeekNum} · Session Setup</div>
      </div>
      <div style={{padding:"20px 16px"}}>

        {removedPlayers.length>0&&(
          <div className="card" style={{border:"1px solid rgba(255,107,53,0.3)",background:"rgba(255,107,53,0.05)"}}>
            <div style={{fontWeight:700,fontSize:11,color:"#FF6B35",letterSpacing:2,textTransform:"uppercase",marginBottom:6}}>⚠️ Removed Players Found</div>
            <div style={{fontSize:12,color:"#ccc",marginBottom:10}}>These were removed from the lineup (✕) but still have week history. Restore reconnects them to their past weeks and running balance — you'll just need to re-set their average.</div>
            <div className="flex gap-8 wrap">
              {removedPlayers.map(rec=>{
                const owed=rec.potKeys.reduce((t,k)=>t+Math.max(0,currentBalance(weekHistory,rec.id,k)),0);
                return (
                  <button key={rec.id} onClick={()=>restorePlayer(rec)} style={{display:"flex",flexDirection:"column",alignItems:"flex-start",gap:2,padding:"8px 14px",borderRadius:10,background:"rgba(255,107,53,0.1)",border:"1px solid rgba(255,107,53,0.35)",color:"#FF6B35"}}>
                    <span style={{fontWeight:700,fontSize:13}}>↩️ Restore {rec.name}</span>
                    {owed>0.005&&<span style={{fontSize:10,color:"#ffb38a"}}>${owed.toFixed(2)} balance carries back too</span>}
                  </button>
                );
              })}
            </div>
          </div>
        )}

        <div className="card">
          <div className="section-label" style={{color:"#FFE66D"}}>Week Info</div>
          <div className="section-sub">Defaults to the next week number and today's date — change if needed.</div>
          <div className="flex gap-8">
            <div className="flex-1">
              <div style={{fontSize:10,color:"#444",marginBottom:4,textTransform:"uppercase",letterSpacing:1}}>Week #</div>
              <input className="inp" type="number" style={{width:"100%"}} value={weekNumDraft!==null?weekNumDraft:autoWeekNum} onChange={e=>setWeekNumDraft(e.target.value)}/>
            </div>
            <div className="flex-1">
              <div style={{fontSize:10,color:"#444",marginBottom:4,textTransform:"uppercase",letterSpacing:1}}>Date</div>
              <input className="inp" type="date" style={{width:"100%"}} value={dateDraft!==null?dateDraft:todayISO()} onChange={e=>setDateDraft(e.target.value)}/>
            </div>
          </div>
        </div>

        <div className="card">
          <div className="section-label" style={{color:"#4ECDC4"}}>Regular Lineup</div>
          <div className="section-sub">Tap ✏️ to edit name or average. Tap ▲▼ to reorder bowling order. Tap ✕ to remove.</div>
          {players.filter(p=>p.isRegular).map((p,i,arr)=><RosterRow key={p.id} p={p} index={i} isSub={false} isFirst={i===0} isLast={i===arr.length-1}/>)}
          <div className="flex gap-8 mt-8">
            <input className="inp flex-1" value={newRegName} onChange={e=>setNewRegName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addRegular()} placeholder="Add player name"/>
            <input className="inp" type="number" value={newRegAvg} onChange={e=>setNewRegAvg(e.target.value)} style={{width:70}} placeholder="Avg"/>
            <button onClick={addRegular} style={{padding:"9px 14px",borderRadius:8,background:"linear-gradient(135deg,#4ECDC4,#2eada5)",border:"none",color:"#0a0a14",fontWeight:700,fontSize:13}}>+ Add</button>
          </div>
        </div>

        <div className="card">
          <div className="section-label" style={{color:"#F72585"}}>Subs Tonight</div>
          <div className="section-sub">Add a substitute for this session.</div>
          {players.filter(p=>!p.isRegular).map((p,i,arr)=><RosterRow key={p.id} p={p} index={0} isSub={true} isFirst={i===0} isLast={i===arr.length-1}/>)}
          <div className="flex gap-8">
            <input className="inp flex-1" value={subName} onChange={e=>setSubName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addSub()} placeholder="Sub name"/>
            <input className="inp" type="number" value={subAvg} onChange={e=>setSubAvg(e.target.value)} style={{width:70}} placeholder="Avg"/>
            <button onClick={addSub} style={{padding:"9px 14px",borderRadius:8,background:"linear-gradient(135deg,#F72585,#c01060)",border:"none",color:"#fff",fontWeight:700,fontSize:13}}>+ Sub</button>
          </div>
        </div>

        <div className="card">
          <div className="section-label" style={{color:"#C77DFF"}}>Who's Absent Tonight?</div>
          <div className="section-sub">Absent players sit this week out entirely — no scores, no dots, no pot.</div>
          <div className="presence-section">
            {players.map(p=>{ const absent=absentDraft.has(p.id); const c=COLORS[p.colorIdx]; return(
              <button key={p.id} onClick={()=>setAbsentDraft(prev=>{const n=new Set(prev);n.has(p.id)?n.delete(p.id):n.add(p.id);return n;})}
                style={{display:"flex",alignItems:"center",gap:8,padding:"8px 14px",borderRadius:24,border:`2px solid ${absent?"rgba(255,68,68,0.4)":c.bg+"60"}`,background:absent?"rgba(255,68,68,0.07)":c.bg+"10",transition:"all .15s"}}>
                <div className="avatar" style={{width:26,height:26,background:absent?"#2a1a1a":c.bg,color:absent?"#ff4444":c.text,fontSize:12,opacity:absent?0.6:1}}>{p.name.charAt(0)}</div>
                <span style={{fontSize:13,fontWeight:700,color:absent?"#ff4444":"#ddd",textDecoration:absent?"line-through":"none"}}>{p.name}</span>
                <span style={{fontSize:14}}>{absent?"🚫":"✓"}</span>
              </button>
            );})}
          </div>
          {absentDraft.size>0&&(
            <div style={{padding:"10px 12px",background:"rgba(255,230,109,0.04)",border:"1px solid rgba(255,230,109,0.15)",borderRadius:10,marginTop:14}}>
              <div style={{fontSize:9,fontWeight:700,letterSpacing:2,color:"#FFE66D",textTransform:"uppercase",marginBottom:6}}>🎳 Bowling Tonight (pot this week)</div>
              {players.filter(p=>!absentDraft.has(p.id)).map(p=><div key={p.id} style={{fontSize:12,color:"#ccc",marginBottom:2}}>• {p.name}</div>)}
            </div>
          )}
        </div>

        {weekHistory.length>0&&(
          <div className="card">
            <div className="section-label mb-12" style={{color:"#FFE66D"}}>Season At A Glance</div>
            <div className="flex gap-10 wrap">
              <div style={{flex:1,minWidth:100,padding:"10px 14px",background:"rgba(255,230,109,0.05)",border:"1px solid rgba(255,230,109,0.15)",borderRadius:10,textAlign:"center"}}>
                <div style={{fontSize:24,fontWeight:700,color:"#FFE66D"}}>${mainTotal.toFixed(2)}</div>
                <div style={{fontSize:10,color:"#666"}}>Main Pot</div>
              </div>
              {sideTotals.map(({key,total})=>(
                <div key={key} style={{flex:1,minWidth:100,padding:"10px 14px",background:"rgba(199,125,255,0.05)",border:"1px solid rgba(199,125,255,0.15)",borderRadius:10,textAlign:"center"}}>
                  <div style={{fontSize:24,fontWeight:700,color:"#C77DFF"}}>${total.toFixed(2)}</div>
                  <div style={{fontSize:10,color:"#666"}}>{potLabel(weekHistory,key)}</div>
                </div>
              ))}
            </div>
            <button onClick={()=>exportToExcel(players,weekHistory)} style={{marginTop:12,width:"100%",padding:"10px",borderRadius:10,background:"linear-gradient(135deg,#06D6A0,#02a077)",border:"none",color:"#0a0a14",fontWeight:700,fontSize:13}}>
              📊 Export to Excel
            </button>
          </div>
        )}

        <WeekHistoryCard weekHistory={weekHistory} players={players} expandedWeek={expandedWeek} setExpandedWeek={setExpandedWeek} recPay={recPay}/>

        {missingAvg.length>0&&(
          <div className="card" style={{border:"1px solid rgba(255,68,68,0.3)",background:"rgba(255,68,68,0.05)"}}>
            <div style={{fontWeight:700,fontSize:11,color:"#ff4444",letterSpacing:2,textTransform:"uppercase",marginBottom:6}}>⚠️ Averages Needed</div>
            <div style={{fontSize:12,color:"#ccc",marginBottom:10}}>Set an average for everyone before starting the week — averages drive the miss-average and over/under-average dot rules. Tap a name to set it.</div>
            <div className="flex gap-6 wrap">
              {missingAvg.map(p=>(
                <button key={p.id} onClick={()=>setEditAvg(prev=>({...prev,[p.id]:""}))} style={{fontSize:11,fontWeight:700,color:"#ff4444",background:"rgba(255,68,68,0.12)",border:"1px solid rgba(255,68,68,0.3)",padding:"5px 12px",borderRadius:20}}>{p.name}</button>
              ))}
            </div>
          </div>
        )}

        <button onClick={startSession} disabled={missingAvg.length>0} style={{width:"100%",padding:"16px",borderRadius:14,
            background:missingAvg.length>0?"#20202e":"linear-gradient(135deg,#FF6B35,#e55520)",
            border:"none",color:missingAvg.length>0?"#555":"#fff",fontWeight:700,fontSize:18,letterSpacing:2,textTransform:"uppercase",
            boxShadow:missingAvg.length>0?"none":"0 4px 24px rgba(255,107,53,0.25)",marginBottom:12,cursor:missingAvg.length>0?"not-allowed":"pointer"}}>
          {missingAvg.length>0?"🔒 Set Averages To Start":"🎳 Start Week "+effectiveWeekNum}
        </button>
        {weekHistory.length>0&&(
          <button onClick={resetSeason} style={{width:"100%",padding:"10px",borderRadius:10,background:"transparent",border:"1px solid rgba(255,68,68,0.16)",color:"#ff4444",fontSize:11,fontWeight:700}}>🗑 Reset Entire Season</button>
        )}
        {weekHistory.length>0&&(
          <button onClick={()=>setShowDebug(v=>!v)} style={{width:"100%",padding:"8px",borderRadius:10,background:"transparent",border:"1px solid #2a2a3e",color:"#555",fontSize:10,fontWeight:700,marginTop:8}}>🔍 {showDebug?"Hide":"Show"} Raw Ledger (debug)</button>
        )}
        {showDebug&&(
          <div className="card" style={{marginTop:8}}>
            <div className="section-label mb-8" style={{color:"#4ECDC4"}}>Raw Ledger</div>
            <div className="section-sub">One row per player per closed week -- exactly what's stored. A red row means the id that week's data is filed under is currently a DIFFERENT player -- use Reassign to move that one week's dots/dollars/scoresheet onto the correct current player, without touching any other week.</div>
            {weekHistory.map(wk=>wk.groups.map(g=>g.contributions.map(c=>{
              const current=players.find(p=>p.id===c.playerId);
              const mismatched=!current||current.name!==c.name;
              const seriesIssue=current?checkSeriesRule(wk,current):null;
              const flagged=mismatched||seriesIssue;
              return(
                <div key={wk.weekNum+"-"+g.potKey+"-"+c.playerId} style={{padding:"8px 10px",marginBottom:6,borderRadius:8,background:flagged?"rgba(255,68,68,0.07)":"#080814",border:flagged?"1px solid rgba(255,68,68,0.3)":"1px solid #1a1a2e"}}>
                  <div style={{fontSize:11,color:"#ccc",marginBottom:flagged?6:0}}>
                    Wk{wk.weekNum} [{g.potKey}] <b>{c.name}</b> (id {c.playerId}): {c.dots} dots, owed ${(c.dotsOwed||0).toFixed(2)}, paid ${(c.amountPaid||0).toFixed(2)}
                  </div>
                  {mismatched&&(
                    <>
                      <div style={{fontSize:10,color:"#ff4444",marginBottom:6}}>⚠ id {c.playerId} is currently {current?current.name:"not in the roster"} -- this week's data doesn't belong to them.</div>
                      <div style={{display:"flex",gap:4,flexWrap:"wrap",alignItems:"center"}}>
                        <span style={{fontSize:10,color:"#555"}}>Move this week's data to:</span>
                        {players.filter(p=>p.id!==c.playerId).map(p=>(
                          <button key={p.id} onClick={()=>{ if(window.confirm("Move Week "+wk.weekNum+"'s "+c.dots+" dots / $"+(c.dotsOwed||0).toFixed(2)+" owed / $"+(c.amountPaid||0).toFixed(2)+" paid from id "+c.playerId+" onto "+p.name+"? This only changes this one week."))reassignWeekPlayer(wk.weekNum,c.playerId,p.id); }}
                            style={{fontSize:10,fontWeight:700,padding:"3px 9px",borderRadius:6,background:"rgba(78,205,196,0.1)",border:"1px solid rgba(78,205,196,0.35)",color:"#4ECDC4"}}>{p.name}</button>
                        ))}
                      </div>
                    </>
                  )}
                  {!mismatched&&seriesIssue&&(
                    <>
                      <div style={{fontSize:10,color:"#ff4444",marginBottom:6}}>
                        ⚠ Series was {seriesIssue.seriesTotal} vs expected {seriesIssue.expected} ({seriesIssue.kind==="over"?"+":"-"}{Math.abs(seriesIssue.seriesTotal-seriesIssue.expected)}) -- the 100+ {seriesIssue.kind} average rule doesn't show as applied for this week.
                      </div>

{players.map(p=>p.name+": id "+p.id).join("\n")}

                </div>
              </div>

          </div>

        {/* ═══ POT ═══ */}

            <div style={{flex:1,background:"linear-gradient(135deg,#1a1208,#181400)",border:"1px solid rgba(255,230,109,0.15)",borderRadius:14,padding:18,textAlign:"center"}}>
              <div style={{fontSize:10,fontWeight:700,color:"#666",letterSpacing:3,textTransform:"uppercase",marginBottom:4}}>Main Pot</div>

                <div style={{fontSize:38,fontWeight:700,color:"#C77DFF",lineHeight:1}}>${total.toFixed(2)}</div>

            {presentPlayers.length>0&&(
              <div className="mb-14">

            {absentPlayers.length>0&&(
              <div style={{fontSize:12,color:"#555"}}>
                🚫 Sitting out this week (no pot): {absentPlayers.map(p=>p.name).join(", ")}
              </div>

          <div className="card mb-16">

            {players.map(p=>{
              // Balances/paid are always recomputed from weekHistory (see currentBalance),

              const keys=allPotKeysForPlayer(weekHistory,p.id);

              const agg={};

              const entries=Object.values(agg);
