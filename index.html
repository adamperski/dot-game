                <div className="card mb-14">
                  <div className="section-label mb-12" style={{color:"#FFE66D"}}>💸 Total Paid ({statWeek?"Week "+statWeek:"Season"})</div>
                  {[...sps].sort((a,b)=>totalPaid(b)-totalPaid(a)).map((p,i)=>{ const c=COLORS[p.colorIdx],tot=totalPaid(p),side=totalPaid(p)-totalPaidByPot(p,MAIN_KEY); return(
                    <div key={p.id} className="flex items-center gap-10 mb-8">
                      <span style={{fontSize:16,width:24}}>{!statPlayer&&(i===0?"🥇":i===1?"🥈":i===2?"🥉":"")}</span>
                      <div style={{width:8,height:8,borderRadius:"50%",background:c.bg,flexShrink:0}}/>
                      <span style={{flex:1,fontSize:13}}>{p.name}</span>
                      <div className="text-right">
                        <div style={{fontWeight:700,color:"#FFE66D",fontSize:15}}>${tot.toFixed(2)}</div>
                        {side>0&&<div style={{fontSize:10,color:"#C77DFF"}}>${side.toFixed(2)} side</div>}
                      </div>
                    </div>
                  ); })}
                </div>

                {/* Fair payout split */}
                <div className="card mb-14">
                  <div className="section-label mb-12" style={{color:"#06D6A0"}}>🎁 Fair Payout Split ({statWeek?"Week "+statWeek:"Season"})</div>
                  <div style={{fontSize:11,color:"#555",marginBottom:12}}>Each pot's collected money split equally among only the players who were actually in it that week — a sub only shares in the weeks they played.</div>
                  {(()=>{
                    const fair=fairPayoutSplit(wh);
                    const sorted=[...sps].filter(p=>(fair[p.id]?.total||0)>0.005).sort((a,b)=>(fair[b.id]?.total||0)-(fair[a.id]?.total||0));
                    if(sorted.length===0) return <div style={{fontSize:12,color:"#444"}}>Nothing collected yet.</div>;
                    return sorted.map(p=>{
                      const c=COLORS[p.colorIdx],f=fair[p.id]||{main:0,side:0,total:0};
                      return(
                        <div key={p.id} className="flex items-center gap-10 mb-8">
                          <div style={{width:8,height:8,borderRadius:"50%",background:c.bg,flexShrink:0}}/>
                          <span style={{flex:1,fontSize:13}}>{p.name}</span>
                          <div className="text-right">
                            <div style={{fontWeight:700,color:"#06D6A0",fontSize:15}}>${f.total.toFixed(2)}</div>
                            {f.side>0.005&&<div style={{fontSize:10,color:"#C77DFF"}}>${f.side.toFixed(2)} side</div>}
                          </div>
                        </div>
                      );
                    });
                  })()}
                </div>

                {/* Score averages */}
                {Object.values(scoreStats).some(ss=>ss.games.length>0)&&(
                  <div className="card mb-14">
                    <div className="section-label mb-12" style={{color:"#4ECDC4"}}>🎳 Score Averages</div>
                    {[...sps].filter(p=>scoreStats[p.id]&&scoreStats[p.id].games.length>0).sort((a,b)=>{
                      const avgA=scoreStats[a.id].games.reduce((t,v)=>t+v,0)/scoreStats[a.id].games.length;
                      const avgB=scoreStats[b.id].games.reduce((t,v)=>t+v,0)/scoreStats[b.id].games.length;
                      return avgB-avgA;
                    }).map((p,i)=>{
                      const ss=scoreStats[p.id]; const avg=Math.round(ss.games.reduce((t,v)=>t+v,0)/ss.games.length);
                      const hi=Math.max(...ss.games); const c=COLORS[p.colorIdx];
                      return(
                        <div key={p.id} className="flex items-center gap-10 mb-8">
                          <span style={{fontSize:16,width:24}}>{!statPlayer&&(i===0?"🥇":i===1?"🥈":i===2?"🥉":"")}</span>
                          <div style={{width:8,height:8,borderRadius:"50%",background:c.bg,flexShrink:0}}/>
                          <span style={{flex:1,fontSize:13}}>{p.name}</span>
                          <div className="text-right">
                            <div style={{fontWeight:700,color:"#4ECDC4",fontSize:15}}>avg {avg}</div>
                            <div style={{fontSize:10,color:"#555"}}>hi {hi} · {ss.games.length} games</div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}

                {/* Event stat bars */}
                {[{label:"Opens",key:"opens",icon:"😬"},{label:"Hung",key:"hung",icon:"🪝"},{label:"Splits Left",key:"splits",icon:"🎳"},{label:"Missed 5-Pin",key:"miss5",icon:"🎯"},{label:"Turkeys",key:"turkeys",icon:"🦃"},{label:"4+ Streaks",key:"streaks",icon:"🔥"},{label:"Small Picks",key:"smallPicks",icon:"👏"},{label:"Large Picks",key:"largePicks",icon:"🎉"},{label:"7-10 Picks",key:"sevenTen",icon:"👑"}].map(cat=>{
                  const vals=entries.map(e=>({name:e.name,colorIdx:e.colorIdx,count:e[cat.key]})).filter(v=>v.count>0).sort((a,b)=>b.count-a.count);
                  if(!vals.length)return null;
                  const mx=vals[0].count;
                  return(<div key={cat.key} className="card mb-10">
                    <div className="flex items-center gap-6 mb-12"><span style={{fontSize:16}}>{cat.icon}</span><span style={{fontSize:10,fontWeight:700,letterSpacing:2,textTransform:"uppercase",color:"#888"}}>{cat.label}</span></div>
                    {vals.map(v=><StatBar key={v.name} label={v.name} value={v.count} max={mx} color={COLORS[v.colorIdx].bg}/>)}
                  </div>);
                })}

                {/* Hall */}
                <div className="card">
                  <div className="section-label mb-14" style={{color:"#F72585"}}>Hall of Shame & Glory</div>
                  {[
                    {label:"Most Opens",key:"opens",icon:"😬",shame:true},
                    {label:"Most Hung",key:"hung",icon:"🪝",shame:true},
                    {label:"Most Splits Left",key:"splits",icon:"🎳",shame:true},
                    {label:"Most Missed 5-Pin",key:"miss5",icon:"🎯",shame:true},
                    {label:"Turkey King",key:"turkeys",icon:"🦃",shame:false},
                    {label:"Streak Monster",key:"streaks",icon:"🔥",shame:false},
                    {label:"Small Split Slayer",key:"smallPicks",icon:"👏",shame:false},
                    {label:"Large Split Slayer",key:"largePicks",icon:"🎉",shame:false},
                    {label:"7-10 Legend",key:"sevenTen",icon:"👑",shame:false},
                    {label:"Most Paid",key:"paid",icon:"💸",shame:true},
                  ].map(cat=>{ const sorted=[...entries].sort((a,b)=>b[cat.key]-a[cat.key]); const top=sorted[0]; if(!top||top[cat.key]===0)return null; const c=COLORS[top.colorIdx]; return(
                    <div key={cat.key} className="hall-row">
                      <span style={{fontSize:18}}>{cat.icon}</span>
                      <div className="flex-1"><div style={{fontSize:10,color:"#444"}}>{cat.label}</div><div style={{fontSize:14,color:c.bg,fontWeight:700}}>{top.name}</div></div>
                      <div style={{fontSize:18,fontWeight:700,color:cat.shame?"#FF6B35":"#4ECDC4"}}>{cat.key==="paid"?"$"+top[cat.key].toFixed(2):top[cat.key]+"×"}</div>
                    </div>
                  ); })}
                </div>
              </>);
            })()}
          </>)}
        </>}

        {/* ═══ RULES ═══ */}
        {tab==="rules"&&(
          <div>
            <div className="section-label mb-12" style={{color:"#444"}}>Rule Reference · 50¢ Per Dot</div>
            {[
              {icon:"😬",label:"Open Frame",desc:"Failed to convert spare",val:"+2 dots"},
              {icon:"🎯",label:"Missed 5-Pin",desc:"Left only the 5-pin standing (extra on top of open)",val:"+2 dots"},
              {icon:"🎳",label:"Split Leave (missed)",desc:"Left a split and didn't convert",val:"+1 dot"},
              {icon:"🚩",label:"First Team Open",desc:"Very first open frame of the game by anyone on the team",val:"+1 dot"},
              {icon:"💀",label:"Open 10th Frame",desc:"Extra penalty for opening the 10th",val:"+2 dots"},
              {icon:"🪝",label:"Hung",desc:"Only person in group not to strike in a frame (not spares)",val:"+2 dots"},
              {icon:"🪝🪝",label:"Hung 2 in a row",desc:"Consecutive frames where same person is hung",val:"+3 dots"},
              {icon:"🪝🪝🪝",label:"Hung 3+ in a row",desc:"Three+ consecutive hung frames",val:"+4 dots"},
              {icon:"📉",label:"Miss Average",desc:"Final game score below your average",val:"+1 dot"},
              {icon:"🕳️",label:"Gutter Ball (1st throw)",desc:"Gutter on first ball of a frame",val:"+2 dots"},
              {icon:"⏭️",label:"Out of Turn",desc:"Bowled when it wasn't your turn",val:"+2 dots"},
              {icon:"🔀",label:"Wrong Lane",desc:"Bowled on the wrong lane",val:"+2 dots"},
              {icon:"💥",label:"Break Team Streak",desc:"Non-strike after 5+ consecutive team strikes in sequence",val:"+1 dot"},
              {icon:"🤦",label:"100+ Under Average",desc:"Series total 100+ pins under average × games bowled (a bad night, not one bad game)",val:"+20 dots"},
              {icon:"👏",label:"Small Split — Converted",desc:"Others each get 1 dot",val:"others +1"},
              {icon:"🎉",label:"Large Split — Converted",desc:"Others each get 2 dots",val:"others +2"},
              {icon:"🦃",label:"Turkey (3 strikes)",desc:"Others each get 1 dot",val:"others +1"},
              {icon:"🔥",label:"4+ Strike Streak",desc:"Others get 2 dots per additional frame",val:"others +2"},
              {icon:"🌟",label:"100+ Over Average",desc:"Series total 100+ pins over average × games bowled (a great night, not one great game)",val:"-$10"},
              {icon:"👑",label:"7-10 Conversion",desc:"Wipes ALL your dots for the night",val:"WIPE ALL"},
            ].map(ev=>(
              <div key={ev.label} className="flex items-start gap-10" style={{background:"#0f0f22",borderRadius:10,padding:"10px 14px",border:"1px solid rgba(255,255,255,0.03)",marginBottom:5}}>
                <span style={{fontSize:20,flexShrink:0}}>{ev.icon}</span>
                <div className="flex-1"><div style={{fontSize:13,fontWeight:700,color:"#ddd"}}>{ev.label}</div><div style={{fontSize:11,color:"#444",marginTop:2}}>{ev.desc}</div></div>
                <div style={{flexShrink:0,fontSize:12,fontWeight:700,color:ev.val.includes("WIPE")?"#FFE66D":ev.val.includes("-$")?"#4ECDC4":ev.val.includes("others")?"#C77DFF":"#FF6B35"}}>{ev.val}</div>
              </div>
            ))}
          </div>
        )}

      </div>
    </div>
  );
}

// ─── Error Boundary ───────────────────────────────────────────────────────────
// If anything unexpected throws during render, show a recoverable screen instead
// of a blank page — state is autosaved to localStorage on every change, so a
// reload always picks back up where you left off.
class ErrorBoundary extends React.Component {
  constructor(props){ super(props); this.state={hasError:false}; }
  static getDerivedStateFromError(){ return {hasError:true}; }
  componentDidCatch(err,info){ console.error('App crashed:', err, info); }
  render(){
    if(this.state.hasError){
      return (
        <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24,textAlign:"center"}}>
          <div style={{fontSize:40,marginBottom:12}}>⚠️</div>
          <div style={{fontWeight:700,fontSize:16,marginBottom:8}}>Something went wrong</div>
          <div style={{fontSize:13,color:"#888",marginBottom:20,maxWidth:280}}>Your entries are saved automatically — reload to continue where you left off.</div>
          <button onClick={()=>window.location.reload()} style={{padding:"12px 28px",borderRadius:10,background:"#FF6B35",border:"none",color:"#fff",fontWeight:700,fontSize:14}}>Reload</button>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById("app")).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
<script>
if("serviceWorker"in navigator){
  const sw=`self.addEventListener("install",()=>self.skipWaiting());self.addEventListener("activate",()=>self.clients.claim());self.addEventListener("fetch",e=>e.respondWith(fetch(e.request).catch(()=>new Response("offline"))));`;
  navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:"application/javascript"}))).catch(()=>{});
}
</script>
